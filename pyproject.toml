[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-coalesce-columns"
version = "1.0.0"
description = "Fill one CSV column from ordered source columns, row by row"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pandas==3.0.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
csv-coalesce-columns = "csv_coalesce_columns:main"

[tool.setuptools]
py-modules = ["csv_coalesce_columns"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
